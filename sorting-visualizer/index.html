<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sorting Visualizer</title>
    <link rel="stylesheet" type="text/css" href="../css/sorting-visualizer.css" />
  </head>

  <body>
    <h1>Sorting Visualizer</h1>
    <div id="graphs-container">
        <div id="template-graph" class="graph"></div>
        <div id="template-graph" class="graph">
          <div class="bar sorted" style="height:10%; width:10%"></div>
          <div class="bar sorted" style="height:20%; width:10%"></div>
          <div class="bar sorted" style="height:30%; width:10%"></div>
          <div class="bar selected" style="height:70%; width:10%"></div>
          <div class="bar" style="height:90%; width:10%"></div>
          <div class="bar" style="height:60%; width:10%"></div>
          <div class="bar" style="height:50%; width:10%"></div>
          <div class="bar" style="height:100%; width:10%"></div>
          <div class="bar selected" style="height:40%; width:10%"></div>
          <div class="bar" style="height:80%; width:10%"></div>
        </div>
        <div id="template-graph" class="graph"></div>
        <div id="template-graph" class="graph"></div>
        <div id="template-graph" class="graph"></div>
    </div>
    <script src="graph.js"></script>

</html>
